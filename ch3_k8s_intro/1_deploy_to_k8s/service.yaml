apiVersion: v1  # API版本，v1是Kubernetes中最稳定的版本
kind: Service   # 资源类型，这里定义的是一个Service服务
metadata:       # 元数据部分，包含资源的基本信息
  name: timeserver  # 服务名称，其他资源可以通过这个名称访问该服务
spec:           # 规格说明部分，定义了Service的具体配置
  selector:     # 选择器，用于确定哪些Pod属于这个Service
    pod: timeserver-pod  # 标签选择器，Service会将流量路由到带有此标签的Pod
  ports:        # 端口配置
  - port: 80    # Service自身暴露的端口，集群内部可以通过这个端口访问服务
    targetPort: 80  # 目标Pod的端口，Service会将流量转发到Pod的这个端口
    protocol: TCP   # 使用的协议，这里是TCP协议
  type: LoadBalancer  # Service类型，LoadBalancer表示会创建外部负载均衡器，使服务可以从集群外部访问
